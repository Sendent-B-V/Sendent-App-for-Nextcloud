name: E2E retention flow

# Runs tests/e2e/retention-flow.sh against a real Nextcloud with files_retention,
# once per supported Nextcloud version: Sendent tags and app config, share
# expiry/removal tagging, and deletion by the files_retention RetentionJob.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  retention-flow:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # files_retention has a stableXX branch for every server branch
        nextcloud-versions: ['stable30', 'stable31', 'stable32', 'stable33', 'stable34', 'stable35']

    name: retention flow on ${{ matrix.nextcloud-versions }}
    steps:
    - name: Set up php 8.3
      uses: shivammathur/setup-php@v2
      with:
        # 8.3 is supported by every Nextcloud version in the matrix
        php-version: '8.3'
        extensions: ctype, curl, dom, gd, gmp, iconv, intl, json, mbstring, openssl, pdo_sqlite, posix, sqlite, xml, zip
        coverage: none
    - name: Checkout Nextcloud
      run: git clone https://github.com/nextcloud/server.git --recursive --shallow-submodules --depth 1 -b ${{ matrix.nextcloud-versions }} nextcloud
    - name: Checkout files_retention
      run: git clone https://github.com/nextcloud/files_retention.git --depth 1 -b ${{ matrix.nextcloud-versions }} nextcloud/apps/files_retention
    - name: Install Nextcloud
      run: php -f nextcloud/occ maintenance:install --database-name oc_autotest --database-user oc_autotest --admin-user admin --admin-pass admin --database sqlite --database-pass=''
    - name: Checkout the app
      uses: actions/checkout@v6
      with:
        path: nextcloud/apps/sendent
    - name: Enable apps
      run: |
        php -f nextcloud/occ app:enable files_retention
        php -f nextcloud/occ app:enable sendent
    - name: Start web server
      run: |
        php -S localhost:8080 -t nextcloud > server.log 2>&1 &
        for i in $(seq 1 30); do
          curl -sf http://localhost:8080/status.php && exit 0
          sleep 1
        done
        echo "Nextcloud did not start"; cat server.log; exit 1
    - name: Run retention flow test
      env:
        NC_URL: http://localhost:8080
      run: bash nextcloud/apps/sendent/tests/e2e/retention-flow.sh
    - name: Show logs
      if: failure()
      run: |
        echo "::group::nextcloud.log"; cat nextcloud/data/nextcloud.log || true; echo "::endgroup::"
        echo "::group::web server log"; cat server.log || true; echo "::endgroup::"
