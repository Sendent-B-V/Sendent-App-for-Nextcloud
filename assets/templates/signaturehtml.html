<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
</head>
<body style="margin:0;padding:0;">
<table cellpadding="0" cellspacing="0" border="0" style="font-family:Arial,sans-serif;font-size:13px;color:#333333;">
  <tbody>
    <tr>
      <td style="font-family:Arial,sans-serif;font-size:14px;font-weight:bold;color:#0D1136;padding:0 0 2px 0;">
        {DISPLAYNAME}&nbsp;<span style="font-weight:normal;font-size:12px;color:#777777;">{PRONOUNS}</span>
      </td>
    </tr>
    <tr>
      <td style="font-family:Arial,sans-serif;font-size:13px;color:#555555;padding:0 0 10px 0;">
        {ROLE} &#8226; {ORGANISATION}
      </td>
    </tr>
    <tr>
      <td style="border-top:2px solid #F37D1E;font-size:0;line-height:0;padding:0 0 10px 0;">&nbsp;</td>
    </tr>
    <tr>
      <td style="font-family:Arial,sans-serif;font-size:13px;color:#333333;padding:0 0 2px 0;">
        {PHONE}
      </td>
    </tr>
    <tr>
      <td style="font-family:Arial,sans-serif;font-size:13px;padding:0 0 2px 0;">
        <a href="mailto:{EMAIL}" style="color:#F37D1E;text-decoration:none;">{EMAIL}</a>
      </td>
    </tr>
    <tr>
      <td style="font-family:Arial,sans-serif;font-size:13px;padding:0 0 2px 0;">
        <a href="{WEBSITE}" style="color:#F37D1E;text-decoration:none;">{WEBSITE}</a>
      </td>
    </tr>
    <tr>
      <td style="font-family:Arial,sans-serif;font-size:12px;color:#777777;padding:6px 0 0 0;">
        {LOCATION}
      </td>
    </tr>
  </tbody>
</table>
</body>
</html>
